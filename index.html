<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מסוף קשר - תדרים</title>
  <!-- ספריית תקשורת בזמן אמת -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, monospace; }
    body { background-color: #0d1117; color: #00ff66; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #161b22; border: 2px solid #00ff66; border-radius: 12px; width: 100%; max-width: 480px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,102,0.15); }
    h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; text-shadow: 0 0 8px #00ff66; }
    .card { display: flex; flex-direction: column; gap: 15px; }
    input, button { padding: 12px; border-radius: 6px; border: 1px solid #00ff66; background: #0d1117; color: #00ff66; font-size: 1rem; outline: none; }
    input::placeholder { color: #007733; }
    button { background: #00ff66; color: #0d1117; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #00cc52; box-shadow: 0 0 10px #00ff66; }
    .hidden { display: none !important; }
    .freq-display { text-align: center; font-size: 2.2rem; background: #000; padding: 15px; border-radius: 8px; border: 1px solid #00ff66; color: #00ff66; text-shadow: 0 0 10px #00ff66; font-family: monospace; }
    .chat-box { height: 260px; background: #000; border: 1px solid #005522; border-radius: 6px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #0a2213; padding: 8px 12px; border-radius: 6px; border-right: 3px solid #00ff66; word-break: break-word; font-size: 0.95rem; }
    .msg.self { border-right: 3px solid #0088ff; background: #0a192f; color: #66b3ff; }
    .status { text-align: center; font-size: 0.85rem; color: #00aa44; }
  </style>
</head>
<body>

<div class="container">
  <h1>📡 מסוף קשר - תדרים</h1>

  <!-- מסך 1: בחירת תדר -->
  <div id="setup-screen" class="card">
    <label>הזן מספר תדר (למשל 104.5):</label>
    <input type="number" id="freq-input" step="0.1" placeholder="תדר..." value="104.5">
    <label>כינוי במכשיר הקשר:</label>
    <input type="text" id="username-input" placeholder="שם משתמש" value="יחידה 1">
    <button onclick="connectToFrequency()">התחבר לתדר</button>
  </div>

  <!-- מסך 2: שידור וקליטה -->
  <div id="radio-screen" class="card hidden">
    <div class="freq-display">MHz <span id="current-freq">104.5</span></div>
    <div class="status" id="status-text">מתחבר לרשת...</div>
    <div class="chat-box" id="messages"></div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="message-input" placeholder="הקלד תשדורת..." style="flex: 1;" onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">שדר</button>
    </div>
    <button onclick="disconnect()" style="background: #ff3333; color: white; border-color: #ff3333;">נתק תדר</button>
  </div>
</div>

<script>
  let client = null;
  let currentChannel = "";
  let myName = "";

  function connectToFrequency() {
    const freq = document.getElementById('freq-input').value.trim();
    myName = document.getElementById('username-input').value.trim() || "אנונימי";

    if (!freq) return alert("נא להזין תדר תקין!");

    // הגדרת ערוץ השידור לפי מספר התדר
    currentChannel = `radio/freq/${freq.replace('.', '_')}`;
    document.getElementById('current-freq').innerText = freq;
    document.getElementById('status-text').innerText = "מתחבר לתדר...";

    // התחברות לשרת תמיכה בזמן אמת בחינם over WebSockets
    client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      document.getElementById('status-text').innerText = "🟢 מחובר ומאזין לתדר";
      client.subscribe(currentChannel);
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('radio-screen').classList.remove('hidden');
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        addMessage(data.sender, data.text, data.sender === myName);
      } catch (e) {
        console.error("שגיאה בקבלת הנתונים", e);
      }
    });

    client.on('error', () => {
      document.getElementById('status-text').innerText = "🔴 שגיאת תקשורת";
    });
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text || !client) return;

    const payload = JSON.stringify({ sender: myName, text: text });
    client.publish(currentChannel, payload);
    input.value = "";
  }

  function addMessage(sender, text, isSelf) {
    const box = document.getElementById('messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${isSelf ? 'self' : ''}`;
    msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
    box.appendChild(msgDiv);
    box.scrollTop = box.scrollHeight;
  }

  function disconnect() {
    if (client) client.end();
    document.getElementById('messages').innerHTML = "";
    document.getElementById('radio-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
